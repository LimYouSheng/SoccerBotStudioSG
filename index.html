function allocation(b,amount){const weights=studios.map(s=>({studio:s.id,value:b.entries.filter(e=>e.studio===s.id).reduce((n,e)=>n+e.price,0)})).filter(x=>x.value);const sum=weights.reduce((n,x)=>n+x.value,0);let used=0;return weights.map((x,i)=>{const value=i===weights.length-1?amount-used:Math.round(amount*x.value/sum);used+=value;return {studio:x.studio,amount:value};});}

function seed(){
 const data={version:1,revision:0,bookings:[],transactions:[],overrides:{},audit:[]};
 const names=['Alex Tan','Jamie Lim','Northside Academy','Daniel Lee','Rachel Ng','United School','Amir Hassan','Shawn Goh','Wei Ming','Marcus Tan'];
 for(let offset=-35;offset<=14;offset++){
  const date=addDays(today,offset),count=offset%3===0?3:2;
  for(let n=0;n<count;n++){
   if(offset>0&&(offset+n)%4===0)continue;
   const index=Math.abs(offset*7+n*3)%14,studio=studios[(Math.abs(offset)+n)%2].id,len=n===0&&offset%4===0?2:1;
   const entries=Array.from({length:len},(_,j)=>({date,start:starts[index+j],studio}));
   if(entries.some(e=>data.bookings.some(b=>b.entries.some(x=>key(x)===key(e)))))continue;
   const id='DEMO-'+String(offset+36).padStart(2,'0')+'-'+n;
   const b={id,reference:'SB-'+String(offset+36).padStart(3,'0')+String(n+1),customer:names[(Math.abs(offset)+n)%names.length],phone:'+65 8123 4567',email:'demo@example.com',activity:n%2?'Training':'Play',players:1+(Math.abs(offset+n)%4),entries:entries.map(e=>({...e,price:price(e)})),status:'confirmed',notes:'',createdAt:now()};
   data.bookings.push(b);
   if(!(offset>=0&&n===1&&offset%3===0)){
    const paidDate=offset>0?addDays(today,-(offset%5)):addDays(date,-1);
    data.transactions.push(paymentRecord(b,total(b),'payment',paidDate,n%2?'PayNow':'Card'));
    if(offset===-6&&n===0){b.status='cancelled';data.transactions.push(paymentRecord(b,total(b),'refund',addDays(today,-3),'Card','Cancelled reservation'));}
   }
  }
 }
 for(const studio of studios){for(const start of ['18:00','18:40']){const e={date:today,start,studio:studio.id};if(!data.bookings.some(b=>b.status!=='cancelled'&&b.entries.some(x=>key(x)===key(e))))data.overrides[key(e)]={reason:'Equipment maintenance',createdAt:now()};}}
 data.audit.push({id:uid('LOG'),at:now(),text:'Demonstration schedule loaded',detail:'Sample bookings and transactions'});return data;
}
const STORE='soccerbotstudio-admin-demo-v1';
let persistenceError='';
function load(){try{const raw=localStorage.getItem(STORE);if(raw){const d=JSON.parse(raw);if(d.version!==1||!Array.isArray(d.bookings)||!Array.isArray(d.transactions)||!d.overrides||!Array.isArray(d.audit))throw Error('Unsupported saved data');return d;}const d=seed();localStorage.setItem(STORE,JSON.stringify(d));return d;}catch(e){persistenceError='Browser storage is unavailable. Changes cannot be saved on this device.';return seed();}}

const selected=new Set();
let selectedDate=today,month=today.slice(0,7)+'-01',view='schedule',dialogState=null,modalHistory=false,toastTimer=null,notice=persistenceError,installPrompt=null;
let revenueFrom=today.slice(0,7)+'-01',revenueTo=today,studioFilter='all',ledgerPage=0,ledgerSearch='',bookSearch='',bookStatus='upcoming',bookPage=0;
const netPaid=(data,b)=>data.transactions.filter(t=>t.bookingId===b.id).reduce((n,t)=>n+(t.type==='payment'?t.amount:-t.amount),0);
const balance=(data,b)=>Math.max(0,total(b)-netPaid(data,b));
const paymentState=(data,b)=>{const paid=netPaid(data,b);if(paid>total(b))return 'Overpaid';if(paid>=total(b))return 'Paid';if(paid>0)return 'Part paid';if(data.transactions.some(t=>t.bookingId===b.id&&t.type==='refund'))return 'Refunded';return 'Unpaid';};
const activeBooking=(data,e,excludeId)=>data.bookings.find(b=>b.id!==excludeId&&b.status!=='cancelled'&&b.entries.some(x=>key(x)===key(e)));
const slotState=(data,e,excludeId)=>activeBooking(data,e,excludeId)?'booked':data.overrides[key(e)]?'blocked':'open';
const unpack=k=>{const [studio,date,start]=k.split('|');return {studio,date,start};};
function assertEntries(data,entries,existing){
 if(!entries.length)throw Error('Select at least one session.');
 if(new Set(entries.map(key)).size!==entries.length)throw Error('A session has been selected twice.');
 for(const e of entries){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!starts.includes(e.start)||!studios.some(s=>s.id===e.studio))throw Error('Choose valid studio times.');
  const unchanged=existing?.entries.some(old=>key(old)===key(e));
  if(e.date<today&&!unchanged)throw Error('New sessions must be today or later.');
  if(activeBooking(data,e,existing?.id))throw Error(`${studioName(e.studio)} at ${e.start} on ${label(e.date)} is already booked.`);
  if(data.overrides[key(e)]&&!unchanged)throw Error(`${studioName(e.studio)} at ${e.start} is blocked. Reopen it first.`);
 }
}
function audit(data,text,detail=''){data.audit.unshift({id:uid('LOG'),at:now(),text,detail});data.audit=data.audit.slice(0,80);}
function commit(change){
 try{
  const stored=localStorage.getItem(STORE),latest=stored?JSON.parse(stored):null;
  if(latest&&(latest.revision!==state.revision||(dialogState?.revision!==undefined&&dialogState.revision!==latest.revision))){state=latest;render();throw Error('Data changed in another tab. Close this form and reopen it before saving.');}
  if(!latest&&state.revision>0)throw Error('Saved data was cleared. Reload the portal before editing.');
  const next=clone(state);change(next);next.revision++;localStorage.setItem(STORE,JSON.stringify(next));state=next;return true;
 }catch(error){showError(error.message||'Changes could not be saved.');return false;}
}

function addMonths(amount){const d=new Date(month+'T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+amount);month=d.toISOString().slice(0,7)+'-01';render();}
function monthView(){

 return `<div class="page-heading"><div><h1>Schedule</h1><p>Manage availability and reservations.</p></div><button class="btn" data-action="new-booking">${icon('plus')}Add new booking</button></div><div class="schedule-layout"><div class="calendar-side">${monthView()}<section class="card card-pad day-summary"><div class="card-title"><h3>Day at a glance</h3><span class="small muted">36 slots</span></div><div class="legend"><span><i class="swatch"></i>Open</span><span><i class="swatch booked"></i>Booked</span><span><i class="swatch blocked"></i>Blocked</span></div><div class="day-metrics"><div><strong>${36-booked-blocked}</strong><span>Open</span></div><div><strong>${booked}</strong><span>Booked</span></div><div><strong>${blocked}</strong><span>Blocked</span></div></div></section><section class="card card-pad activity-card"><div class="card-title"><h3>Recent changes</h3></div><ul class="activity-list">${state.audit.slice(0,4).map(a=>`<li><p>${esc(a.text)}</p><small>${esc(a.detail)} · ${new Intl.DateTimeFormat('en-SG',{timeZone:'Asia/Singapore',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(a.at))}</small></li>`).join('')}</ul></section></div><section class="card"><div class="schedule-toolbar"><div><h2>${label(selectedDate)}</h2><p>40-minute sessions · Up to 4 players</p></div><div class="toolbar-actions"><button class="btn secondary compact" data-action="select-open" ${selectedDate<today?'disabled':''}>Select open slots</button></div></div><div class="schedule-scroll"><table class="slots-table"><thead><tr><th scope="col">SGT</th>${studios.map(s=>`<th scope="col">${s.name}</th>`).join('')}</tr></thead><tbody>${starts.map(start=>`<tr><td>${start}<br><span class="muted">${end(start)}</span></td>${studios.map(studio=>{const e={date:selectedDate,start,studio:studio.id},k=key(e),booking=activeBooking(state,e),status=slotState(state,e),sel=selected.has(k),past=selectedDate<today;return `<td><button class="slot ${status} ${sel?'selected':''} ${past?'past':''}" data-action="slot" data-key="${k}" ${past&&!booking?'disabled':''} ${booking?'':'aria-pressed="'+sel+'"'} aria-label="${studio.name}, ${start} to ${end(start)}, ${status}${booking?', '+esc(booking.customer):''}"><span><strong>${booking?esc(booking.customer):status==='blocked'?'Blocked':'Open'}</strong><small>${booking?esc(paymentState(state,booking))+' · '+booking.players+' players':status==='blocked'?esc(state.overrides[k].reason):money(price(e))}</small></span>${icon(booking?'arrow':sel?'check':status==='blocked'?'lock':'plus')}</button></td>`;}).join('')}</tr>`).join('')}</tbody></table></div><div class="selection-bar"><div class="selection-count"><strong>${selected.size} selected</strong>${selected.size?'<button class="text-btn" data-action="clear-selected">Clear</button>':''}</div><div class="selection-actions"><button class="btn secondary" data-action="override-open" ${!selected.size?'disabled':''}>Open slots</button><button class="btn secondary" data-action="override-block" ${!selected.size?'disabled':''}>${icon('lock')}Block slots</button><button class="btn" data-action="reserve-selected" ${!selected.size?'disabled':''}>Reserve</button></div></div><p class="schedule-hint">Select open or blocked slots to override availability. Open a booking to edit it.</p></section></div>`;
}
function filteredBookings(){return state.bookings.filter(b=>{const upcoming=b.entries.some(e=>e.date>=today);return (bookStatus==='all'||(bookStatus==='upcoming'&&upcoming&&b.status!=='cancelled')||(bookStatus==='unpaid'&&b.status!=='cancelled'&&balance(state,b)>0)||(bookStatus==='cancelled'&&b.status==='cancelled'))&&(!bookSearch||[b.customer,b.reference,b.phone,b.email].join(' ').toLowerCase().includes(bookSearch.toLowerCase()));}).sort((a,b)=>ordered(a.entries)[0].date.localeCompare(ordered(b.entries)[0].date)||a.reference.localeCompare(b.reference));}

function filteredTransactions(){return state.transactions.filter(t=>t.date>=revenueFrom&&t.date<=revenueTo&&(studioFilter==='all'||t.allocations.some(a=>a.studio===studioFilter))).map(t=>({...t,visibleAmount:studioFilter==='all'?t.amount:t.allocations.filter(a=>a.studio===studioFilter).reduce((n,a)=>n+a.amount,0)})).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));}
function revenueData(){const tx=filteredTransactions(),payments=tx.filter(t=>t.type==='payment').reduce((n,t)=>n+t.visibleAmount,0),refunds=tx.filter(t=>t.type==='refund').reduce((n,t)=>n+t.visibleAmount,0);return {tx,payments,refunds,net:payments-refunds};}
function revenue(){
 const {tx,payments,refunds,net}=revenueData(),days=Math.round((new Date(revenueTo+'T12:00:00Z')-new Date(revenueFrom+'T12:00:00Z'))/86400000)+1,bucket=Math.max(1,Math.ceil(days/14));

 const max=Math.max(10000,...bins.map(b=>b.amount)),ledger=tx.filter(t=>!ledgerSearch||[t.customer,t.reference,t.method].join(' ').toLowerCase().includes(ledgerSearch.toLowerCase()));ledgerPage=Math.min(ledgerPage,Math.max(0,Math.ceil(ledger.length/10)-1));

 return `<div class="page-heading"><div><h1>Revenue</h1><p>Payments received, less recorded refunds.</p></div><button class="btn secondary" data-action="export">${icon('download')}Export CSV</button></div><div class="period-bar"><label>Period<select id="period"><option value="custom">Custom dates</option><option value="month" ${revenueFrom===today.slice(0,7)+'-01'&&revenueTo===today?'selected':''}>This month</option><option value="week" ${revenueFrom===addDays(today,-6)&&revenueTo===today?'selected':''}>Last 7 days</option><option value="30" ${revenueFrom===addDays(today,-29)&&revenueTo===today?'selected':''}>Last 30 days</option></select></label><label>From<input type="date" id="revenue-from" value="${revenueFrom}" max="${revenueTo}"></label><label>To<input type="date" id="revenue-to" value="${revenueTo}" min="${revenueFrom}"></label><label>Studio<select id="studio-filter"><option value="all">All studios</option>${studios.map(s=>`<option value="${s.id}" ${studioFilter===s.id?'selected':''}>${s.name}</option>`).join('')}</select></label><span class="period-note">SGD · Inclusive of GST</span></div><section class="metrics" aria-label="Revenue totals"><div class="card metric highlight"><label>Net collected</label><strong>${money(net)}</strong><small>Payments minus refunds</small></div><div class="card metric"><label>Payments</label><strong>${money(payments)}</strong><small>${tx.filter(t=>t.type==='payment').length} recorded payments</small></div><div class="card metric"><label>Refunds</label><strong>${money(refunds)}</strong><small>${tx.filter(t=>t.type==='refund').length} recorded refunds</small></div><div class="card metric"><label>Outstanding</label><strong>${money(outstanding)}</strong><small>All active bookings · All dates</small></div></section><div class="revenue-middle"><section class="card card-pad"><div class="card-title"><h2>Payment activity</h2><span class="small muted">${days<=14?'Daily':'Grouped by '+bucket+' days'}</span></div><div class="chart-container )}<small>${esc(t.method)}</small></td><td class="ledger-customer"><button data-action="view-booking" data-id="${t.bookingId}">${esc(t.customer)}</button><small>${esc(t.reference)}</small></td><td class="ledger-type"><span class="pill ${t.type==='refund'?'refund':''}">${t.type==='refund'?'Refund':'Payment'}</span></td><td class="ledger-amount amount ${t.type==='refund'?'negative':''}">${t.type==='refund'?'−':''}${money(t.visibleAmount)}</td></tr>`).join('')}</tbody></table>${!ledger.length?'<div class="empty">No transactions in this period.</div>':''}<div class="table-footer"><span>${ledger.length} transactions</span>${pageControls(ledgerPage,ledger.length,'ledger-page')}</div></section>`;

function render(){view=['schedule','bookings','revenue'].includes(location.hash.slice(1))?location.hash.slice(1):'schedule';document.querySelectorAll('[data-view]').forEach(a=>a.setAttribute('aria-current',a.dataset.view===view?'page':'false'));$('app').innerHTML=`<div class="page">${notice?`<div class="notice" role="alert"><button data-action="dismiss-notice" aria-label="Dismiss">${icon('close')}</button>${esc(notice)}</div>`:''}${({schedule,bookings,revenue}[view])()}<footer class="bottom-note"><span>© ${new Date().getFullYear()} SOCCERBOTSTUDIO Singapore.</span><span>Demo data · Saved on this device</span></footer></div>`;document.title=`${({schedule:'Schedule',bookings:'Bookings',revenue:'Revenue'}[view])} | SOCCERBOTSTUDIO Admin`;updateStatus();}
function updateStatus(){$('device-status').textContent=navigator.onLine===false?'Offline · Saved on this device':'Saved on this device';}
function modal(title,body){$('modal-content').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="Close">${icon('close')}</button></div><div class="modal-body"><div class="dialog-error" id="dialog-error" role="alert" hidden></div>${body}</div>`;if(!$('modal').open){history.pushState({adminDialog:true},'',location.href);modalHistory=true;$('modal').showModal();}}
function closeModal(fromHistory=false){$('modal').close();dialogState=null;if(modalHistory&&!fromHistory){modalHistory=false;history.back();}else modalHistory=false;}
function openBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b){toast('Booking not found.');return;}dialogState={type:'view',id};const paid=netPaid(state,b),due=balance(state,b),extra=Math.max(0,paid-total(b));modal('Booking '+esc(b.reference),`<div class="row-between" style="margin-bottom:22px"><strong>${esc(b.customer)}</strong>${bookingPill(b)}</div><dl class="booking-facts"><dt>Contact</dt><dd>${esc(b.phone)}${b.email?'<br>'+esc(b.email):''}</dd><dt>Activity</dt><dd>${b.activity} · ${b.players} ${b.players===1?'player':'players'}</dd><dt>Booked total</dt><dd>${money(total(b))}</dd><dt>Net received</dt><dd>${money(paid)}</dd>${b.status!=='cancelled'&&due?`<dt>Outstanding</dt><dd><strong>${money(due)}</strong></dd>`:''}${extra?`<dt>Overpayment</dt><dd>${money(extra)}</dd>`:''}</dl><ul class="booking-times">${ordered(b.entries).map(e=>`<li><span>${label(e.date)}<small>${e.start}–${end(e.start)} · ${studioName(e.studio)}</small></span><strong>${money(e.price)}</strong></li>`).join('')}</ul>${b.notes?`<div class="reason-box">${esc(b.notes)}</div>`:''}${b.cancelReason?`<div class="reason-box">Cancelled: ${esc(b.cancelReason)}</div>`:''}<div class="modal-actions">${b.status!=='cancelled'?`<button class="btn" data-action="edit-booking" data-id="${b.id}">${icon('edit')}Edit booking</button>${due?`<button class="btn secondary" data-action="record-payment" data-id="${b.id}">Record payment</button>`:''}`:''}${paid>0?`<button class="btn secondary" data-action="record-refund" data-id="${b.id}">Record refund</button>`:''}</div>${b.status!=='cancelled'?`<button class="text-btn" data-action="cancel-booking" data-id="${b.id}" style="color:#9b3f4d;margin-top:18px">Cancel booking</button>`:''}`);}
function startBooking(id=null,entries=[]){const current=id?state.bookings.find(b=>b.id===id):null;if(current?.status==='cancelled'){toast('Cancelled bookings cannot be edited.');return;}const first=ordered(current?.entries||entries)[0];dialogState={type:'form',revision:state.revision,id,draft:current?clone(current):{customer:'',phone:'',email:'',activity:'Play',players:1,notes:'',entries:entries.map(e=>({...e,price:price(e)})),markPaid:false},slotDate:first?.date>=today?first.date:selectedDate>=today?selectedDate:today,slotStudio:first?.studio||'studio-1'};bookingForm();}
function bookingForm(){const ds=dialogState,d=ds.draft,existing=ds.id?state.bookings.find(b=>b.id===ds.id):null;modal(ds.id?'Edit booking':'Add new booking',`<form id="booking-form"><div class="field-row"><label class="field">Customer name<input name="customer" data-draft="customer" value="${esc(d.customer)}" required maxlength="80" autocomplete="off"></label><label class="field">Mobile number<input name="phone" data-draft="phone" type="tel" value="${esc(d.phone)}" required maxlength="24" placeholder="+65 8123 4567"></label></div><label class="field">Email <small>Optional</small><input data-draft="email" type="email" value="${esc(d.email)}" maxlength="120"></label><div class="field-row"><label class="field">Activity<select data-draft="activity">${['Play','Training'].map(x=>`<option ${d.activity===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Players<select data-draft="players">${[1,2,3,4].map(x=>`<option value="${x}" ${Number(d.players)===x?'selected':''}>${x}</option>`).join('')}</select></label></div><h3 class="modal-subtitle">Sessions</h3><div class="field-row"><label class="field">Date<input id="edit-slot-date" type="date" min="${today}" value="${ds.slotDate}"></label><label class="field">Studio<select id="edit-slot-studio">${studios.map(s=>`<option value="${s.id}" ${ds.slotStudio===s.id?'selected':''}>${s.name}</option>`).join('')}</select></label></div><div class="edit-times">${starts.map(start=>{const e={date:ds.slotDate,studio:ds.slotStudio,start},chosen=d.entries.some(x=>key(x)===key(e)),status=slotState(state,e,ds.id);return `<button type="button" class="edit-time ${chosen?'selected':''}" data-action="edit-time" data-start="${start}" ${status!=='open'&&!chosen?'disabled':''} aria-pressed="${chosen}"><span>${start}–${end(start)}</span><small>${status==='open'||chosen?money(price(e)):status==='booked'?'Booked':'Blocked'}</small>${chosen?icon('check'):''}</button>`;}).join('')}</div>${d.entries.length?`<ul class="booking-times" style="margin-top:18px">${ordered(d.entries).map(e=>`<li><span>${label(e.date,{day:'numeric',month:'short'})} · ${e.start}–${end(e.start)}<small>${studioName(e.studio)}</small></span><button type="button" class="icon-btn" data-action="remove-edit-time" data-key="${key(e)}" aria-label="Remove ${e.start} on ${label(e.date)}">${icon('close')}</button></li>`).join('')}</ul>`:'<p class="small muted" style="margin:18px 0">Select one or more times. Add other dates as needed.</p>'}<div class="modal-summary"><span>${d.entries.length} sessions · ${d.entries.length*40} minutes</span><strong>${money(total(d))}</strong></div>${existing?`<p class="small muted" style="margin-bottom:20px">Recorded payments stay unchanged. ${netPaid(state,existing)>total(d)?'Overpayment: '+money(netPaid(state,existing)-total(d)): 'Outstanding after edit: '+money(Math.max(0,total(d)-netPaid(state,existing)))}.</p>`:`<label class="field check-field"><input data-draft="markPaid" type="checkbox" ${d.markPaid?'checked':''}><span>Payment received in full</span></label>`}<label class="field">Notes <small>Optional</small><textarea data-draft="notes" maxlength="300">${esc(d.notes)}</textarea></label><div class="modal-actions"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">${ds.id?'Save changes':'Create booking'}</button></div></form>`);}
function saveBooking(){const ds=dialogState,d=clone(ds.draft);d.customer=d.customer.trim();d.phone=d.phone.trim();d.email=d.email.trim();d.players=Number(d.players);if(!d.customer||!/^[+\d ()-]{8,24}$/.test(d.phone)){showError('Enter a customer name and valid mobile number.');return;}if(![1,2,3,4].includes(d.players)||!['Play','Training'].includes(d.activity)){showError('Choose an activity and up to four players.');return;}let savedId;
 const ok=commit(data=>{const existing=ds.id?data.bookings.find(b=>b.id===ds.id):null;if(ds.id&&(!existing||existing.status==='cancelled'))throw Error('This booking is no longer editable.');assertEntries(data,d.entries,existing);const entries=ordered(d.entries).map(e=>({...e,price:existing?.entries.find(x=>key(x)===key(e))?.price??price(e)}));const b={id:existing?.id||uid('BK'),reference:existing?.reference||reference(),customer:d.customer,phone:d.phone,email:d.email,activity:d.activity,players:d.players,notes:d.notes,entries,status:'confirmed',createdAt:existing?.createdAt||now(),updatedAt:now()};savedId=b.id;if(existing)data.bookings=data.bookings.map(x=>x.id===b.id?b:x);else data.bookings.push(b);if(!existing&&d.markPaid)data.transactions.push(paymentRecord(b,total(b),'payment',today,'Manual'));audit(data,existing?'Booking updated':'Booking created',b.reference+' · '+b.customer);});
 if(ok){selected.clear();closeModal();render();toast(ds.id?'Booking updated.':'Booking created.');}
}
function overrideDialog(mode){const entries=selectedEntries();if(!entries.length)return;dialogState={type:'override',revision:state.revision,mode,entries};modal(mode==='block'?'Block selected slots':'Open selected slots',`<p>${entries.length} ${entries.length===1?'slot':'slots'} on ${label(selectedDate)}. Booked slots cannot be overridden.</p><form id="override-form">${mode==='block'?'<label class="field">Reason<textarea id="override-reason" required maxlength="160" placeholder="Maintenance, private event or staff availability"></textarea></label>':'<p class="small muted">Selected blocked slots will become available for booking.</p>'}<div class="modal-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button type="submit" class="btn">${mode==='block'?'Block slots':'Open slots'}</button></div></form>`);}
function saveOverride(){const ds=dialogState,reason=ds.mode==='block'?$('override-reason').value.trim():'';if(ds.mode==='block'&&!reason){showError('Enter a reason for blocking these slots.');return;}let count=0;const ok=commit(data=>{for(const e of ds.entries){if(e.date<today)throw Error('Past slots cannot be changed.');if(activeBooking(data,e))throw Error('A selected slot has been booked. Review the schedule.');}for(const e of ds.entries){const k=key(e);if(ds.mode==='block'){data.overrides[k]={reason,createdAt:now()};count++;}else if(data.overrides[k]){delete data.overrides[k];count++;}}audit(data,`${count} slots ${ds.mode==='block'?'blocked':'opened'}`,label(selectedDate)+(reason?' · '+reason:''));});if(ok){selected.clear();closeModal();render();toast(`${count} slots ${ds.mode==='block'?'blocked':'opened'}.`);}}
function cancellation(id){const b=state.bookings.find(x=>x.id===id);dialogState={type:'cancel',revision:state.revision,id};modal('Cancel booking',`<p>Cancel ${esc(b.reference)} and release its ${b.entries.length} ${b.entries.length===1?'session':'sessions'}?</p><p>Recorded payments stay unchanged. Record any refund separately.</p><form id="cancel-form"><label class="field">Reason<textarea id="cancel-reason" required maxlength="160"></textarea></label><div class="modal-actions"><button class="btn secondary" type="button" data-action="view-booking" data-id="${b.id}">Keep booking</button><button class="btn danger" type="submit">Cancel booking</button></div></form>`);}
function saveCancellation(){const id=dialogState.id,reason=$('cancel-reason').value.trim();if(!reason){showError('Enter a cancellation reason.');return;}if(commit(data=>{const b=data.bookings.find(x=>x.id===id);if(!b||b.status==='cancelled')throw Error('This booking is already cancelled.');b.status='cancelled';b.cancelReason=reason;b.updatedAt=now();audit(data,'Booking cancelled',b.reference+' · '+reason);})){closeModal();render();toast('Booking cancelled. Slots released.');}}
function transactionDialog(id,type){const b=state.bookings.find(x=>x.id===id),maximum=type==='payment'?balance(state,b):netPaid(state,b),suggested=type==='refund'&&b.status!=='cancelled'?Math.min(maximum,Math.max(0,netPaid(state,b)-total(b)))||maximum:maximum;dialogState={type:'transaction',revision:state.revision,id,transactionType:type};modal(type==='payment'?'Record payment':'Record refund',`<p>${esc(b.reference)} · ${esc(b.customer)}<br>This records an external ${type}. No money is transferred.</p><form id="transaction-form"><div class="field-row"><label class="field">Amount · SGD<input id="transaction-amount" type="number" inputmode="decimal" min="0.01" max="${maximum/100}" step="0.01" value="${suggested/100}" required></label><label class="field">Date<input id="transaction-date" type="date" value="${today}" max="${today}" required></label></div><label class="field">Method<select id="transaction-method">${['PayNow','Card','Cash','Bank transfer'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Reference / note <small>Optional</small><input id="transaction-note" maxlength="160"></label><div class="modal-actions"><button type="button" class="btn secondary" data-action="view-booking" data-id="${id}">Back</button><button type="submit" class="btn">Save ${type}</button></div></form>`);}
function saveTransaction(){const ds=dialogState,amount=Math.round(Number($('transaction-amount').value)*100),date=$('transaction-date').value,method=$('transaction-method').value,note=$('transaction-note').value.trim();const ok=commit(data=>{const b=data.bookings.find(x=>x.id===ds.id);if(!b)throw Error('Booking not found.');const max=ds.transactionType==='refund'?netPaid(data,b):balance(data,b);if(ds.transactionType==='payment'&&b.status==='cancelled')throw Error('Cannot receive payment for a cancelled booking.');if(!Number.isSafeInteger(amount)||amount<=0||amount>max)throw Error('Amount exceeds the available balance.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today)throw Error('Choose a valid received date.');data.transactions.push(paymentRecord(b,amount,ds.transactionType,date,method,note));audit(data,ds.transactionType==='payment'?'Payment recorded':'Refund recorded',b.reference+' · '+money(amount));});if(ok){closeModal();render();toast(ds.transactionType==='payment'?'Payment recorded.':'Refund recorded.');}}
function exportCSV(){const lines=[['Date','Reference','Customer','Type','Method','Amount SGD','Studio','Note'],...filteredTransactions().map(t=>[t.date,t.reference,t.customer,t.type,t.method,((t.type==='refund'?-1:1)*t.visibleAmount/100).toFixed(2),studioFilter==='all'?'All studios':studioName(studioFilter),t.note])];const safe=v=>{const value=String(v);return '"'+(/^[=+@\-]/.test(value)&&!/^[-]?\d+(\.\d+)?$/.test(value)?"'":'')+value.replaceAll('"','""')+'"';};const csv='\uFEFF'+lines.map(row=>row.map(safe).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`SoccerBotStudio_Revenue_${revenueFrom}_${revenueTo}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Revenue CSV downloaded.');}
async function install(){if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome==='accepted')$('install-button').hidden=true;return;}dialogState={type:'install'};modal('Install the admin app',location.protocol==='file:'?'<p>Open the complete PWA folder through HTTPS or a local development server to install it.</p><p>This HTML file can still be used directly in your browser.</p>':'<p>Add this portal to your device for a standalone workspace.</p><ol class="install-list"><li>On iPhone or iPad: open Safari’s Share menu, then Add to Home Screen.</li><li>On Android or desktop: use the browser’s Install app or Add to Home screen option.</li></ol><p class="small muted" style="margin-top:20px">Once loaded online, the portal works offline on this device.</p>');}
function handle(action,el){
 if(action==='date'){selectedDate=el.dataset.date;selected.clear();render();}
 else if(action==='today'){selectedDate=today;month=today.slice(0,7)+'-01';selected.clear();render();}
 else if(action==='month')addMonths(Number(el.dataset.delta));
 else if(action==='slot'){const e=unpack(el.dataset.key),b=activeBooking(state,e);if(b)openBooking(b.id);else{if(selected.has(key(e)))selected.delete(key(e));else selected.add(key(e));const pos=document.querySelector('.schedule-scroll')?.scrollTop||0;render();document.querySelector('.schedule-scroll').scrollTop=pos;}}
 else if(action==='select-open'){studios.forEach(s=>starts.forEach(start=>{const e={date:selectedDate,start,studio:s.id};if(slotState(state,e)==='open')selected.add(key(e));}));render();}
 else if(action==='clear-selected'){selected.clear();render();}
 else if(action==='override-open'||action==='override-block')overrideDialog(action.endsWith('open')?'open':'block');
 else if(action==='reserve-selected'){if(selectedEntries().some(e=>slotState(state,e)!=='open'))showError('Reopen blocked slots before reserving them.');else startBooking(null,selectedEntries());}
 else if(action==='new-booking')startBooking();
 else if(action==='edit-booking')startBooking(el.dataset.id);
 else if(action==='view-booking')openBooking(el.dataset.id);
 else if(action==='edit-time'){const ds=dialogState,e={date:ds.slotDate,studio:ds.slotStudio,start:el.dataset.start},at=ds.draft.entries.findIndex(x=>key(x)===key(e));if(at>=0)ds.draft.entries.splice(at,1);else if(slotState(state,e,ds.id)==='open')ds.draft.entries.push({...e,price:price(e)});const y=$('modal').querySelector('.modal-body').scrollTop;bookingForm();$('modal').querySelector('.modal-body').scrollTop=y;}
 else if(action==='remove-edit-time'){dialogState.draft.entries=dialogState.draft.entries.filter(e=>key(e)!==el.dataset.key);bookingForm();}
 else if(action==='cancel-booking')cancellation(el.dataset.id);
 else if(action==='record-payment'||action==='record-refund')transactionDialog(el.dataset.id,action==='record-payment'?'payment':'refund');
 else if(action==='close')closeModal();
 else if(action==='install')install();
 else if(action==='export')exportCSV();
 else if(action==='booking-page'){bookPage+=Number(el.dataset.delta);render();}
 else if(action==='ledger-page'){ledgerPage+=Number(el.dataset.delta);render();}
 else if(action==='dismiss-notice'){notice='';render();}
 else if(action==='bar')toast(el.title);
}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;handle(el.dataset.action,el);});
document.addEventListener('input',event=>{const e=event.target;if(e.dataset.draft&&dialogState?.type==='form'){dialogState.draft[e.dataset.draft]=e.type==='checkbox'?e.checked:e.value;return;}if(['book-search','ledger-search'].includes(e.id)){const pos=e.selectionStart;if(e.id==='book-search'){bookSearch=e.value;bookPage=0;}else{ledgerSearch=e.value;ledgerPage=0;}render();const field=$(e.id);field.focus();field.setSelectionRange?.(pos,pos);}});
document.addEventListener('change',event=>{const e=event.target;if(e.dataset.draft&&dialogState?.type==='form'){dialogState.draft[e.dataset.draft]=e.type==='checkbox'?e.checked:e.value;return;}
 if(e.id==='edit-slot-date'){if(!e.value||e.value<today)return;dialogState.slotDate=e.value;bookingForm();return;}
 if(e.id==='edit-slot-studio'){dialogState.slotStudio=e.value;bookingForm();return;}
 if(e.id==='book-status'){bookStatus=e.value;bookPage=0;render();return;}
 if(e.id==='period'){if(e.value==='custom')return;revenueTo=today;revenueFrom=e.value==='month'?today.slice(0,7)+'-01':addDays(today,e.value==='week'?-6:-29);}
 if(e.id==='studio-filter')studioFilter=e.value;
 if(e.id==='revenue-from'||e.id==='revenue-to'){const from=e.id==='revenue-from'?e.value:revenueFrom,to=e.id==='revenue-to'?e.value:revenueTo;if(!from||!to||from>to||new Date(to)-new Date(from)>366*86400000){toast('Choose a date range of up to one year.');render();return;}revenueFrom=from;revenueTo=to;}
 if(['period','studio-filter','revenue-from','revenue-to'].includes(e.id)){ledgerPage=0;render();}
});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='booking-form')saveBooking();else if(event.target.id==='override-form')saveOverride();else if(event.target.id==='cancel-form')saveCancellation();else if(event.target.id==='transaction-form')saveTransaction();});
$('modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
window.addEventListener('popstate',()=>{if(modalHistory)closeModal(true);});
window.addEventListener('hashchange',()=>{if($('modal').open)closeModal(true);selected.clear();notice=persistenceError;render();window.scrollTo({top:0});});
window.addEventListener('storage',event=>{if(event.key!==STORE)return;try{const next=JSON.parse(event.newValue);if(next?.version===1&&next.revision!==state.revision){state=next;render();toast('Schedule updated in another tab.');}}catch{notice='Saved data changed. Reload before making further edits.';render();}});
window.addEventListener('online',updateStatus);window.addEventListener('offline',updateStatus);
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});window.addEventListener('appinstalled',()=>{$('install-button').hidden=true;toast('Admin app installed.');});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('install-button').hidden=true;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
if('serviceWorker' in navigator&&location.protocol!=='file:'&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>toast('Offline setup unavailable. You can continue in the browser.')));}
render();
})();

</script></body></html>
